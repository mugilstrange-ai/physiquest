name: Test database rules

on:
  push:
    branches: [main, 'test/**']
    paths: ['firebase/**', '.github/workflows/database.yml']
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install test packages
        working-directory: firebase
        run: npm install --no-audit --no-fund
      - name: Install Firebase tools
        run: npm install -g firebase-tools
      - name: Run the rules and cloud-code tests against the Firebase emulators
        working-directory: firebase
        run: firebase emulators:exec --only auth,firestore --project demo-physiquest "npm test"
