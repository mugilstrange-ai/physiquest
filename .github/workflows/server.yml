name: Test server
on:
  push:
    paths: ['firebase/**', '.github/workflows/server.yml', 'docs/index.html']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install server packages
        working-directory: firebase/functions
        run: npm install --no-audit --no-fund
      - name: Install Firebase tools
        run: npm install -g firebase-tools
      - name: Run the tests against the Firestore emulator
        working-directory: firebase
        run: firebase emulators:exec --only firestore --project demo-physiquest "cd functions && npm test"
      - name: Check the server code loads
        working-directory: firebase/functions
        run: GCLOUD_PROJECT=demo-physiquest node -e "console.log('functions:', Object.keys(require('./index.js')).join(', '))"
      - name: Check the web libraries the app loads are online
        run: |
          for u in https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js https://checkout.razorpay.com/v1/checkout.js; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$u"); echo "$code $u"; test "$code" = "200"
          done
