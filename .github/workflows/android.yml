name: Build Android app

on:
  push:
    branches: [main, 'test/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bundle fonts so the app works fully offline
        run: python3 tools/bundle_fonts.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build the APK and the Play Store bundle
        working-directory: android
        run: gradle assembleRelease bundlePlay --no-daemon --stacktrace

      - name: Name the files
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk PhysiQuest.apk
          cp android/app/build/outputs/bundle/play/app-play.aab PhysiQuest-play-unsigned.aab

      # Google Play needs the bundle signed with your private upload key. It is kept only in this
      # repository's secrets (Settings > Secrets and variables > Actions), never in the code:
      # PLAY_UPLOAD_KEYSTORE (the .jks file in base64), PLAY_UPLOAD_PASSWORD and PLAY_UPLOAD_ALIAS.
      # Until they are added, the bundle stays unsigned, as before.
      - name: Sign the Google Play bundle (when the upload key is set up)
        env:
          KS: ${{ secrets.PLAY_UPLOAD_KEYSTORE }}
          KS_PASS: ${{ secrets.PLAY_UPLOAD_PASSWORD }}
          KS_ALIAS: ${{ secrets.PLAY_UPLOAD_ALIAS }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
            jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KS_PASS" -sigalg SHA256withRSA -digestalg SHA-256 \
              PhysiQuest-play-unsigned.aab "${KS_ALIAS:-upload}"
            jarsigner -verify PhysiQuest-play-unsigned.aab | tail -1
            mv PhysiQuest-play-unsigned.aab PhysiQuest-play.aab
            rm -f "$RUNNER_TEMP/upload.jks"
          else
            echo "No upload key in the secrets yet: the Play bundle stays unsigned."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: PhysiQuest
          path: |
            PhysiQuest.apk
            PhysiQuest-play*.aab

      - name: Publish the download link (main branch only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest PhysiQuest.apk PhysiQuest-play*.aab \
            --title "PhysiQuest for Android" \
            --notes "Download **PhysiQuest.apk** on your Android phone and open it to install. The .aab file is the Google Play bundle (PhysiQuest-play.aab once your upload key is in the repository secrets). Built from commit ${GITHUB_SHA::7}."
