<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AI Test</title></head><body style="margin:0"><title>AI Test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: a scoreboard-style top bar, one centred working column; exam mode fills the screen. */
:root{--bg:#f3f5f1;--card:#ffffff;--ink:#14201b;--mut:#5c6b64;--line:#d9e0d9;--turf:#17694a;--turf-ink:#ffffff;--amber:#c77d0a;--soft:#e6f0ea;--bad:#b42318;--bad-soft:#fdecea;--ok:#13795b;--ok-soft:#e3f4ec;--board:#10231b;--board-ink:#f4f7f2;--ans:#1a7f37;--nans:#c23b22;--rev:#6b4bc4;--nv:#e9ece8;
--display:"Barlow Condensed","Arial Narrow",sans-serif;--body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--board)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--board);color:var(--board-ink)}
.bar .in{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.5rem;letter-spacing:.04em;text-transform:uppercase}
.brand small{font-family:var(--body);font-size:.75rem;letter-spacing:.08em;opacity:.7;margin-left:8px}
.sp{flex:1}
.clock{font-family:var(--display);font-size:1.7rem;letter-spacing:.05em;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.08);border-radius:8px;padding:0 12px}
.clock.low{color:#ffb4a8}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--display);letter-spacing:.02em;text-wrap:balance;margin:0}
h1{font-size:2.4rem;line-height:1.05}h2{font-size:1.6rem}h3{font-size:1.2rem}
.lead{color:var(--mut);max-width:62ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.stack{display:flex;flex-direction:column;gap:12px}
label{font-weight:600;font-size:.9rem}
input[type=text],textarea{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
button{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;cursor:pointer}
button.go{background:var(--turf);color:var(--turf-ink);border-color:var(--turf)}
button.warn{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
.rules{margin:0;padding-left:20px}.rules li{margin:4px 0}
.note{font-size:.85rem;color:var(--mut)}
.msg{border-radius:10px;padding:10px 12px;font-size:.92rem}
.msg.bad{background:var(--bad-soft);color:var(--bad)}.msg.ok{background:var(--ok-soft);color:var(--ok)}.msg.info{background:var(--soft)}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.pill.live{background:var(--ok-soft);color:var(--ok)}.pill.done{background:var(--soft);color:var(--turf)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.wait{background:var(--soft);color:var(--mut)}
/* exam */
.exam{user-select:none;-webkit-user-select:none}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.qnum{font-family:var(--display);font-size:1.2rem;color:var(--amber);letter-spacing:.06em;text-transform:uppercase}
.qtext{font-size:1.35rem;font-weight:600;margin:6px 0 16px;line-height:1.35}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:12px;font-weight:500}
.opt .k{font-family:var(--display);font-size:1.2rem;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--soft);flex:none}
.opt.sel{border-color:var(--turf);background:var(--soft)}.opt.sel .k{background:var(--turf);color:var(--turf-ink)}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.pal{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.pal button{padding:6px 0;font-size:.85rem;font-variant-numeric:tabular-nums}
.pal button.an{background:var(--turf);color:var(--turf-ink);border-color:var(--turf)}
.pal button.cur{outline:3px solid var(--amber);outline-offset:1px}
.examgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
@media (max-width:760px){.examgrid{grid-template-columns:1fr}}
.mark{position:fixed;inset:0;pointer-events:none;z-index:1;display:grid;place-items:center;opacity:.05;font-family:var(--display);font-size:5vw;transform:rotate(-24deg);color:var(--ink);text-align:center;white-space:pre}
.banner{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 70px);z-index:20;max-width:min(560px,92vw)}
/* result */
.score{font-family:var(--display);font-size:5rem;line-height:1;color:var(--turf)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;word-break:break-all;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px;user-select:all;-webkit-user-select:all}
/* invigilator */
.big{font-family:var(--display);font-size:2.6rem;letter-spacing:.12em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem}.kv b{color:var(--mut);font-weight:600}
.log{max-height:220px;overflow:auto;font-size:.85rem;border-top:1px solid var(--line);margin-top:8px;padding-top:6px}
.log div{padding:3px 0;border-bottom:1px dashed var(--line)}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.86rem}th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{color:var(--mut);font-weight:600}
.right{color:var(--ok);font-weight:700}.wrong{color:var(--bad);font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* test layout */
.tl{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
@media (max-width:820px){.tl{grid-template-columns:1fr}}
.qpanel{display:flex;flex-direction:column;min-height:60vh}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px;flex-wrap:wrap}
.qmeta{display:flex;gap:8px;flex-wrap:wrap}.qmeta span{font-size:.78rem;border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--mut)}
.qbody{flex:1;padding:16px 0}
.opt{width:100%}
.opt .rad{width:20px;height:20px;border-radius:50%;border:2px solid var(--mut);flex:none;display:grid;place-items:center}
.opt.sel .rad{border-color:var(--turf)}.opt.sel .rad::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--turf)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px}
.actions .l,.actions .r{display:flex;gap:8px;flex-wrap:wrap}
button.revb{background:var(--card);color:var(--rev);border-color:var(--rev)}
.cand{display:flex;gap:10px;align-items:center}
.ava{width:42px;height:42px;border-radius:10px;background:var(--board);color:var(--board-ink);display:grid;place-items:center;font-family:var(--display);font-size:1.3rem;flex:none}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.8rem}
.legend div{display:flex;gap:8px;align-items:center}
.pal5{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.pb{position:relative;font:inherit;font-weight:700;font-size:.85rem;padding:0;height:36px;border-radius:8px;border:1px solid var(--line);cursor:pointer;font-variant-numeric:tabular-nums}
.pb.nv{background:var(--nv);color:var(--ink)}
.pb.na{background:var(--nans);color:#fff;border-color:var(--nans);border-radius:8px 8px 18px 18px}
.pb.an{background:var(--ans);color:#fff;border-color:var(--ans);border-radius:18px 18px 8px 8px}
.pb.rv{background:var(--rev);color:#fff;border-color:var(--rev);border-radius:50%}
.pb.ar{background:var(--rev);color:#fff;border-color:var(--rev);border-radius:50%}
.pb.ar::after{content:"✓";position:absolute;right:-5px;bottom:-5px;width:17px;height:17px;border-radius:50%;background:var(--ans);color:#fff;font-size:10px;line-height:1;display:grid;place-items:center;border:2px solid var(--card)}
.pb.cur{outline:3px solid var(--amber);outline-offset:2px}
.legend .pb{display:inline-grid;place-items:center;flex:none;width:32px;height:28px;font-size:.78rem;cursor:default}
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.modal .card{max-width:520px;width:100%}
#selfcam{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:160px;max-width:30vw;border-radius:10px;border:2px solid var(--turf);z-index:15;background:#000;transform:scaleX(-1)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(function(){
"use strict";
const P = JSON.parse(document.getElementById("payload").textContent);
const app = document.getElementById("app"), barRight = document.getElementById("barRight"), sub = document.getElementById("sub"), banner = document.getElementById("banner");
const h = (tag, attrs, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs || {})) { if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v); } for (const c of kids.flat()) { if (c == null || c === false) continue; e.append(c instanceof Node ? c : document.createTextNode(String(c))); } return e; };
const store = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const norm = c => String(c || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
async function decrypt(code){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(norm(code)), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64d(P.salt), iterations:200000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(P.iv)}, key, b64d(P.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function sha(s){ const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2,"0")).join(""); }
const toB64u = obj => { const bytes = new TextEncoder().encode(JSON.stringify(obj)); let s = ""; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); };
const fromB64u = str => { const s = atob(str.replace(/-/g,"+").replace(/_/g,"/")); return JSON.parse(new TextDecoder().decode(Uint8Array.from(s, c => c.charCodeAt(0)))); };
const mmss = s => { s = Math.max(0, Math.round(s)); return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0"); };
function showBanner(text, kind){ banner.replaceChildren(h("div", {class:"msg " + (kind||"bad"), role:"alert"}, text)); banner.hidden = false; clearTimeout(showBanner.t); showBanner.t = setTimeout(() => banner.hidden = true, 6000); }
async function copyText(text, btn){ try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; } catch(e){ btn.textContent = "Select the text and copy it"; } }
let roomP = null; const getRoom = () => roomP || (roomP = (window.claude && claude.use ? claude.use("room").catch(() => null) : Promise.resolve(null)));

/* ---------------- routing ---------------- */
function route(){
  const v = (location.hash || "").replace("#","");
  barRight.replaceChildren();
  if (v === "student") return student();
  if (v === "invigilator") return invigilator();
  home();
}
window.addEventListener("hashchange", () => { if (!S.active) route(); });

function home(){
  sub.textContent = "Online exam";
  app.replaceChildren(
    h("div", {class:"stack"},
      h("h1", null, "Artificial Intelligence Test"),
      h("p", {class:"lead"}, "60 questions · 60 minutes · full screen only. Pick your role."),
      h("div", {class:"grid2"},
        h("div", {class:"card stack"}, h("h2", null, "Student"), h("p", {class:"note"}, "Take the exam. You need a laptop or desktop with Chrome or Edge, and the exam code from your invigilator."), h("a", {href:"#student"}, h("button", {class:"go"}, "Open student page"))),
        h("div", {class:"card stack"}, h("h2", null, "Invigilator"), h("p", {class:"note"}, "Exam code, live monitoring, force submit and result checking. Only the owner of this page can use it."), h("a", {href:"#invigilator"}, h("button", null, "Open invigilator page")))
      )
    )
  );
}

/* ---------------- student ---------------- */
const S = { active:false, phase:"intro", data:null, order:[], ans:[], idx:0, start:0, end:0, name:"", vio:[], armed:false, baseW:0, baseH:0, timer:null, room:null, result:null };
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pres(extra){ if (!S.room && !(LIVE.conn && LIVE.conn.open)) return; const answered = S.ans.filter(x => x != null).length; const rv = (S.review || []).filter(Boolean).length; const _o = Object.assign({ role:"student", name:S.name.slice(0,40), st:S.phase, q:S.idx + 1, n:P.n, ans:answered, rv, left: S.phase === "exam" ? Math.round((S.end - Date.now())/1000) : null, fs: !!document.fullscreenElement, vio:S.vio.length, mal:!!S.mal, last: S.vio.length ? S.vio[S.vio.length-1].m : null, at:Date.now() }, extra || {}); if (S.room) S.room.presence(_o).catch(() => {}); if (LIVE.conn && LIVE.conn.open) { try { LIVE.conn.send(Object.assign({ t:"status" }, _o)); } catch(e){} } }

function student(){
  sub.textContent = "Student";
  const prev = store.get("ai1_result");
  if (prev && prev.code) { S.result = prev; return renderResult(); }
  const fsOK = !!(document.fullscreenEnabled && document.documentElement.requestFullscreen);
  const touchSmall = matchMedia("(pointer: coarse)").matches && Math.min(screen.width, screen.height) < 820;
  const extended = !!(window.screen && screen.isExtended);
  const err = h("div", {class:"msg bad", role:"alert", hidden:true});
  const nameI = h("input", {type:"text", id:"sname", autocomplete:"name", placeholder:"Your full name", maxlength:"40"});
  const codeI = h("input", {type:"text", id:"scode", autocomplete:"off", placeholder:"e.g. ABC-123-XYZ", maxlength:"20", spellcheck:"false"});
  const agree = h("input", {type:"checkbox", id:"sagree"});
  const startB = h("button", {class:"go", id:"sstart"}, "Start exam in full screen");
  const blocks = [];
  if (!fsOK) blocks.push("This browser cannot open full screen here. Use a laptop or desktop with Chrome or Edge.");
  if (touchSmall) blocks.push("Phones and tablets are not allowed. Open this link on a laptop or desktop.");
  if (extended) blocks.push("A second monitor is connected. Disconnect it, reload this page and try again.");
  if (STANDALONE && foreignNodes().length) blocks.push("A browser extension is changing this page. Open the exam in a Chrome Incognito window (Ctrl+Shift+N) and try again.");
  if (blocks.length) startB.disabled = true;
  let lockEl = null;
  if (window.__OPEN_AT) {
    lockEl = h("div", {class:"msg info", style:"font-weight:700"});
    let lockT = null;
    const tick = () => { const left = window.__OPEN_AT - (Date.now() + (window.__TOFF || 0));
      if (left > 0) { lockEl.className = "msg info"; lockEl.textContent = "The test opens at " + (window.__OPEN_LABEL || "the start time") + ". It opens in " + mmss(left/1000) + ". Share your screen and camera now, then wait."; startB.disabled = true; }
      else { lockEl.className = "msg ok"; lockEl.textContent = "The test is open. Enter the exam code your invigilator gives you."; startB.disabled = blocks.length > 0; if (lockT) clearInterval(lockT); } };
    lockT = setInterval(tick, 1000); tick();
  }
  app.replaceChildren(h("div", {class:"stack"},
    h("h1", null, "Artificial Intelligence Test"),
    h("p", {class:"lead"}, "60 multiple-choice questions · 1 mark each · 60 minutes · no negative marks."),
    h("div", {class:"grid2"},
      h("div", {class:"card stack"}, h("h3", null, "Exam rules"),
        h("ul", {class:"rules"},
          h("li", null, "The exam runs in full screen. ", h("b", null, "Leaving full screen (Esc) submits your exam at once.")),
          h("li", null, h("b", null, "Switching to another tab, window or app, or clicking outside the exam, submits it at once.")),
          h("li", null, h("b", null, "Using any AI app, screen helper, sidebar, screenshot, copy, paste or right-click is malpractice: the test is auto-submitted and marked MALPRACTICE.")),
          h("li", null, "Open this exam in a Chrome Incognito window (Ctrl+Shift+N) so no extensions run."),
          STANDALONE ? h("li", null, h("b", null, "Your entire screen, camera and microphone are streamed live to the invigilator and recorded. Stopping the screen share or turning off the camera is malpractice.")) : null,
          h("li", null, "Copy, paste, right-click and developer tools are blocked and recorded."),
          h("li", null, "Do not use AI apps, phones, books or other people. Your invigilator watches you on a video call."),
          h("li", null, "The exam submits by itself when the 60 minutes end."),
          h("li", null, "Use Save & Next, Mark for Review & Next and Clear Response; the coloured palette on the right shows each question's status."),
          h("li", null, "You can attempt the exam only once on this device."))),
