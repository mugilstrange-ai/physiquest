<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f0626">
<title>PhysiQuest Owner</title>
<style>
:root{--ink:#0f0626;--night:#170a3a;--night-2:#1f0e4d;--line:rgba(191,178,228,.18);--line-2:rgba(191,178,228,.32);--text:#f4efff;--muted:#bfb2e4;--faint:#8577b8;--cyan:#19e0dc;--gold:#ffe06b;--good:#4cf0a0;--bad:#ff6b8a;--on-cyan:#06201f}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1.15rem;margin:0}
.muted{color:var(--muted)}.faint{color:var(--faint);font-size:.88rem}
.panel{background:var(--night);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-weight:600;border:1px solid var(--cyan);background:var(--cyan);color:var(--on-cyan);border-radius:999px;padding:9px 16px;min-height:42px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--cyan)}.btn.bad{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.92rem}.btn:disabled{opacity:.5;cursor:default}
input,select{font:inherit;color:var(--text);background:var(--ink);border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;min-height:42px}
.chip{display:inline-block;border:1px solid var(--line-2);border-radius:999px;padding:2px 10px;font-size:.85rem;color:var(--muted)}
.chip.good{color:var(--good);border-color:rgba(76,240,160,.5)}.chip.warn{color:var(--gold);border-color:rgba(255,224,107,.5)}.chip.bad{color:var(--bad);border-color:rgba(255,107,138,.5)}
.card{border:1px solid var(--line-2);border-radius:12px;padding:14px;display:grid;gap:8px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:.95rem}.kv dt{color:var(--faint)}.kv dd{margin:0;overflow-wrap:anywhere}
.utr{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.1rem;letter-spacing:.04em}
.msg{margin:0;font-size:.92rem}.msg.good{color:var(--good)}.msg.bad{color:var(--bad)}
.note{border-left:3px solid var(--gold);padding:8px 12px;background:rgba(255,224,107,.07);border-radius:6px;font-size:.92rem}
a{color:var(--cyan)}
</style>
</head>
<body>
<main class="wrap">
 <h1>PhysiQuest · Owner</h1>
 <p class="muted" style="margin:0">Approve UPI payments and manage Premium. Only the owner’s Google account can use this page; the database refuses everyone else.</p>
 <div id="app"></div>
</main>
<script>window.PQ_CLOUD={"apiKey": "AIzaSyDXz585ZQmnf6hlQRvH6nxSh4JHZCoP9U0", "projectId": "physiquest-1e225", "webClientId": "1066595834183-0erintjc0up1mol7snuopclvhkf3nip1.apps.googleusercontent.com", "owner": "mugilstrange@gmail.com"};</script>
<script>
/* ================= PhysiQuest cloud: Google sign-in and the database, over plain HTTPS =================
   No big libraries: the app still opens instantly and works offline. Firebase's own web addresses are used:
   Identity Toolkit (sign-in), Secure Token (keeping the sign-in fresh) and Firestore (the database).
   The database rules decide what each person may read or write; this code just asks. */
const PQC=(()=>{
 const W=typeof window!=='undefined'?window:globalThis;
 const C=Object.assign({authUrl:'https://identitytoolkit.googleapis.com',tokenUrl:'https://securetoken.googleapis.com',fsUrl:'https://firestore.googleapis.com',owner:'mugilstrange@gmail.com'},W.PQ_CLOUD||{});
 const on=()=>!!(C.apiKey&&C.projectId);
 const SKEY='physiquest-auth';
 class CloudErr extends Error{constructor(code,msg){super(msg);this.code=code;this.friendly=true;}}
 const MSG={offline:'No internet connection. Connect and try again.',busy:'The server is busy. Please try again in a minute.',denied:'You are not allowed to do that.',
  'signed-out':'Please sign in first.',exists:'That already exists.',expired:'Your sign-in has expired. Please sign in again.'};
 const err=(code,m)=>new CloudErr(code,m||MSG[code]||'Something went wrong. Please try again.');
 let S=null;try{S=JSON.parse(localStorage.getItem(SKEY)||'null');if(!S||typeof S!=='object'||!S.uid||!S.refresh)S=null;}catch(e){S=null;}
 const keep=()=>{try{if(S)localStorage.setItem(SKEY,JSON.stringify(S));else localStorage.removeItem(SKEY);}catch(e){}};
 const listeners=new Set();const changed=()=>listeners.forEach(f=>{try{f(S);}catch(e){}});

 /* one request, with a time limit; turns every failure into a clear CloudErr */
 async function req(method,url,body,form,tok){const ctl=typeof AbortController!=='undefined'?new AbortController():null;const t=ctl?setTimeout(()=>ctl.abort(),20000):0;let r;
  const h={};if(body!==undefined)h['Content-Type']=form?'application/x-www-form-urlencoded':'application/json';if(tok)h.Authorization='Bearer '+tok;
  try{r=await fetch(url,{method,headers:h,body:body===undefined?undefined:(form?body:JSON.stringify(body)),signal:ctl?ctl.signal:undefined});}catch(e){throw err('offline');}finally{if(t)clearTimeout(t);}
  let j=null;const txt=await r.text().catch(()=>'');try{j=txt?JSON.parse(txt):null;}catch(e){}
  if(r.ok)return j;
  const e0=Array.isArray(j)?j[0]&&j[0].error:j&&j.error;const st=e0&&(e0.status||(e0.message||'').split(' ')[0])||'';
  if(r.status===404||st==='NOT_FOUND')return null;
  if(r.status===409||st==='ALREADY_EXISTS'||(st==='FAILED_PRECONDITION'&&/exist/i.test(e0&&e0.message||'')))throw err('exists');
  if(r.status===403||st==='PERMISSION_DENIED')throw err('denied');
  if(/TOKEN_EXPIRED|INVALID_REFRESH_TOKEN|USER_NOT_FOUND|USER_DISABLED|INVALID_ID_TOKEN|CREDENTIAL_TOO_OLD/.test(st))throw err('expired');
  if(r.status===401||st==='UNAUTHENTICATED')throw err('expired');
  if(r.status>=500||r.status===429)throw err('busy');
  throw err('bad',(e0&&e0.message)?'The request was refused: '+String(e0.message).slice(0,120):undefined);}

 /* ---------- sign-in ---------- */
 function setSession(r,old){S={uid:r.localId||r.user_id||(old&&old.uid),email:r.email||(old&&old.email)||'',name:r.displayName||r.fullName||(old&&old.name)||'',
  idToken:r.idToken||r.id_token,refresh:r.refreshToken||r.refresh_token,exp:Date.now()+((+(r.expiresIn||r.expires_in)||3600)-120)*1000,
  at:old&&old.at?old.at:Date.now()};keep();}  /* at = when this person last signed in with Google */
 /* a Google ID token (from the Android sign-in sheet or Google's web button) becomes a PhysiQuest sign-in */
 async function signInGoogle(googleIdToken){if(!on())throw err('off','Accounts are not switched on yet.');
  const r=await req('POST',`${C.authUrl}/v1/accounts:signInWithIdp?key=${C.apiKey}`,{postBody:'id_token='+encodeURIComponent(googleIdToken)+'&providerId=google.com',requestUri:'http://localhost',returnSecureToken:true,returnIdpCredential:true});
  if(!r||!r.idToken)throw err('bad','Google sign-in did not work. Please try again.');setSession(r,null);changed();return S;}
 let refreshing=null;
 async function token(){if(!S)throw err('signed-out');if(Date.now()<S.exp&&S.idToken)return S.idToken;
  if(!refreshing)refreshing=(async()=>{try{const r=await req('POST',`${C.tokenUrl}/v1/token?key=${C.apiKey}`,'grant_type=refresh_token&refresh_token='+encodeURIComponent(S.refresh),true);setSession(r,S);}
   catch(e){if(e.code==='expired'||e.code==='bad'){S=null;keep();changed();}throw e;}finally{refreshing=null;}})();
  await refreshing;return S.idToken;}
 function signOut(){S=null;keep();changed();}

 /* ---------- the database (Firestore REST) ---------- */
 const root=()=>`projects/${C.projectId}/databases/(default)/documents`;
 const url=p=>`${C.fsUrl}/v1/${root()}/${p}`;
 function enc(v){if(v===null||v===undefined)return{nullValue:null};if(typeof v==='boolean')return{booleanValue:v};
  if(typeof v==='number')return Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};if(typeof v==='string')return{stringValue:v};
  if(v instanceof Date)return{timestampValue:v.toISOString()};if(Array.isArray(v))return{arrayValue:{values:v.map(enc)}};
  const f={};for(const k in v)f[k]=enc(v[k]);return{mapValue:{fields:f}};}
 function dec(x){if(!x)return null;if('stringValue'in x)return x.stringValue;if('integerValue'in x)return Number(x.integerValue);if('doubleValue'in x)return x.doubleValue;
  if('booleanValue'in x)return x.booleanValue;if('nullValue'in x)return null;if('timestampValue'in x)return new Date(x.timestampValue);
  if('arrayValue'in x)return(x.arrayValue.values||[]).map(dec);if('mapValue'in x)return fields(x.mapValue.fields);return null;}
 function fields(f){const o={};for(const k in (f||{}))o[k]=dec(f[k]);return o;}
 const encFields=o=>{const f={};for(const k in o)f[k]=enc(o[k]);return f;};
 const idOf=name=>String(name||'').split('/').pop();
 async function get(path){const j=await req('GET',url(path),undefined,false,await token());return j?Object.assign(fields(j.fields),{_id:idOf(j.name)}):null;}
 /* replace a whole document (create it if missing) */
 async function set(path,obj){await req('PATCH',url(path),{fields:encFields(obj)},false,await token());}
 /* create only if it does not exist yet */
 async function create(path,obj){await req('PATCH',url(path)+'?currentDocument.exists=false',{fields:encFields(obj)},false,await token());}
 async function del(path){await req('DELETE',url(path),undefined,false,await token());}
 /* documents in a collection where every field equals the given value */
 async function query(coll,where,limit){const filters=Object.keys(where).map(k=>({fieldFilter:{field:{fieldPath:k},op:'EQUAL',value:enc(where[k])}}));
  const sq={from:[{collectionId:coll}],limit:limit||100};if(filters.length===1)sq.where=filters[0];else if(filters.length)sq.where={compositeFilter:{op:'AND',filters}};
  const j=await req('POST',`${C.fsUrl}/v1/${root()}:runQuery`,{structuredQuery:sq},false,await token());
  return(j||[]).filter(x=>x.document).map(x=>Object.assign(fields(x.document.fields),{_id:idOf(x.document.name)}));}
 /* several writes that all happen together, or not at all */
 async function commit(writes){await req('POST',`${C.fsUrl}/v1/${root()}:commit`,{writes:writes.map(w=>{const o={update:{name:`${root()}/${w.path}`,fields:encFields(w.data)}};
  if(w.mask)o.updateMask={fieldPaths:w.mask};if(w.mustExist)o.currentDocument={exists:true};return o;})},false,await token());}
 /* deletes the sign-in account itself (the database records are removed first by the caller) */
 async function deleteAccount(){const t=await token();await req('POST',`${C.authUrl}/v1/accounts:delete?key=${C.apiKey}`,{idToken:t});signOut();}

 return{C,on,CloudErr,err,user:()=>S,isOwner:()=>!!(S&&S.email&&S.email.toLowerCase()===String(C.owner).toLowerCase()),onChange:f=>listeners.add(f),
  signInGoogle,signOut,token,get,set,create,del,query,commit,deleteAccount,enc,dec};
})();
if(typeof module!=='undefined')module.exports=PQC;

</script>
<script>
(function(){
 const $=q=>document.querySelector(q),app=$('#app');
 const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const DAY0=Date.UTC(2026,0,1)/864e5,todayN=()=>Math.floor(Date.now()/864e5)-DAY0;
 const dayDate=n=>new Date((n+DAY0)*864e5).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
 const PLANS={M:{label:'Monthly',price:99,days:31},Y:{label:'Yearly',price:899,days:366}};
 const CLS={dropper:'NEET / JEE after Class 12',college:'College',other:'Other'};
 const when=d=>d instanceof Date?d.toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):'';
 /* a new plan starts the day after the current one ends, or today if none is running */
 const newExp=(cur,plan)=>{const start=Math.max(todayN(),(typeof cur==='number'?cur+1:0));return start+PLANS[plan].days-1;};
 let pending=[];

 function view(){
  if(!PQC.on()){app.innerHTML='<div class="panel"><p style="margin:0">Accounts are not set up yet: the Firebase settings are missing.</p></div>';return;}
  const u=PQC.user();
  if(!u){app.innerHTML='<div class="panel stack"><h2>Sign in</h2><p class="muted" style="margin:0">Use the owner Google account.</p><div id="g"></div><p class="msg" id="m"></p></div>';signInButton();return;}
  if(!PQC.isOwner()){app.innerHTML=`<div class="panel stack"><h2>Not the owner account</h2><p class="muted" style="margin:0">${esc(u.email)} cannot manage PhysiQuest.</p><button class="btn ghost sm" id="out">Sign out</button></div>`;$('#out').onclick=()=>{PQC.signOut();view();};return;}
  app.innerHTML=`<div class="panel row" style="justify-content:space-between"><span class="faint">Signed in as ${esc(u.email)}</span><button class="btn ghost sm" id="out">Sign out</button></div>
   <div class="panel stack"><div class="row" style="justify-content:space-between"><h2>Waiting for approval</h2><button class="btn sm" id="reload">Refresh</button></div>
    <div class="note">Before approving, open your bank or GPay app and check that this exact UTR shows a payment <b>received</b> for the right amount. Students add the note “PhysiQuest” and a 6-letter reference.</div>
    <div id="list" class="stack"><p class="muted" style="margin:0">Loading…</p></div></div>
   <div class="panel stack"><h2>Look up</h2><div class="row"><input id="q" placeholder="UTR (12 digits) or student email" style="flex:1;min-width:220px"><button class="btn sm" id="find">Find</button></div><div id="found" class="stack"></div></div>`;
  $('#out').onclick=()=>{PQC.signOut();view();};$('#reload').onclick=load;$('#find').onclick=find;$('#q').onkeydown=e=>{if(e.key==='Enter')find();};load();}

 function signInButton(){const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=()=>{google.accounts.id.initialize({client_id:PQC.C.webClientId,ux_mode:'popup',
   callback:r=>{$('#m').textContent='Signing in…';PQC.signInGoogle(r.credential).then(view).catch(e=>{$('#m').className='msg bad';$('#m').textContent=e.message;});}});
  google.accounts.id.renderButton($('#g'),{theme:'filled_black',size:'large',shape:'pill',text:'signin_with'});};s.onerror=()=>{$('#m').textContent='Could not reach Google. Check the internet connection.';};document.head.appendChild(s);}

 async function studentInfo(uid){const [p,pr]=await Promise.all([PQC.get('users/'+uid).catch(()=>null),PQC.get('premium/'+uid).catch(()=>null)]);return{p,pr};}
 function profileKV(p){if(!p)return '<dd>No details saved (account deleted?)</dd>';
  return `<dt>Class</dt><dd>${esc(CLS[p.cls]||('Class '+p.cls))}</dd><dt>Place</dt><dd>${esc(p.city)}, ${esc(p.state)}</dd>${p.phone?`<dt>Mobile</dt><dd><a href="tel:+91${esc(p.phone)}">+91 ${esc(p.phone)}</a></dd>`:''}
   ${p.adult?'<dt>Age</dt><dd>18 or older</dd>':`<dt>Age</dt><dd><span class="chip warn">Under 18</span></dd><dt>Parent</dt><dd>${esc(p.parentName)} · <a href="tel:+91${esc(p.parentPhone)}">+91 ${esc(p.parentPhone)}</a> (agreed in the app)</dd>`}`;}

 async function load(){const list=$('#list');list.innerHTML='<p class="muted" style="margin:0">Loading…</p>';
  try{pending=(await PQC.query('payments',{status:'pending'},200)).sort((a,b)=>(a.at||0)-(b.at||0));}catch(e){list.innerHTML=`<p class="msg bad">${esc(e.message)}</p>`;return;}
  if(!pending.length){list.innerHTML='<p class="muted" style="margin:0">Nothing waiting. All done.</p>';return;}
  list.innerHTML='';for(const x of pending){const c=document.createElement('div');c.className='card';list.appendChild(c);
   c.innerHTML=`<p class="muted" style="margin:0">Loading ${esc(x.name)}…</p>`;studentInfo(x.uid).then(({p,pr})=>payCard(c,x,p,pr));}}
 function payCard(c,x,p,pr){const pl=PLANS[x.plan]||{label:x.plan,price:x.amount,days:0},cur=pr&&typeof pr.exp==='number'?pr.exp:null,exp=newExp(cur,x.plan);
  c.innerHTML=`<div class="row" style="justify-content:space-between"><b>${esc(x.name)}</b><span class="chip">${esc(pl.label)} · ₹${esc(x.amount)}</span></div>
   <div class="row"><span class="utr">${esc(x.utr)}</span><button class="btn ghost sm" data-copy>Copy UTR</button></div>
   <dl class="kv"><dt>Sent</dt><dd>${when(x.at)}</dd><dt>Email</dt><dd>${esc(x.email)}</dd><dt>Reference</dt><dd>PhysiQuest ${esc(String(x.uid).replace(/[^A-Za-z0-9]/g,'').slice(0,6).toUpperCase())}</dd>${profileKV(p)}
    <dt>Premium now</dt><dd>${cur!==null&&cur>=todayN()?'Active until '+dayDate(cur):cur!==null?'Ended '+dayDate(cur):'None'}</dd><dt>If approved</dt><dd>Premium until <b>${dayDate(exp)}</b></dd></dl>
   <div class="row"><button class="btn sm" data-ok>Approve</button><select data-why aria-label="Reason"><option>UTR not found in my bank</option><option>Amount does not match</option><option>Paid to a different account</option><option>Duplicate request</option><option>Other: please contact us</option></select><button class="btn bad sm" data-no>Not approved</button></div><p class="msg" data-m></p>`;
  const m=c.querySelector('[data-m]'),say=(t,g)=>{m.className='msg '+(g?'good':'bad');m.textContent=t;};
  c.querySelector('[data-copy]').onclick=async e=>{try{await navigator.clipboard.writeText(x.utr);e.target.textContent='Copied';}catch(_){}};
  c.querySelector('[data-ok]').onclick=async e=>{const b=e.target;if(!b.dataset.arm){b.dataset.arm=1;b.textContent='Tap again: payment checked';return;}b.disabled=true;
   try{await PQC.commit([{path:'premium/'+x.uid,data:{plan:x.plan,exp,utr:x.utr,at:new Date()}},
     {path:'payments/'+x.utr,data:{status:'approved',decidedAt:new Date(),exp},mask:['status','decidedAt','exp'],mustExist:true}]);
    say('Approved. Premium until '+dayDate(exp)+'.',true);c.querySelectorAll('button,select').forEach(z=>z.disabled=true);}catch(er){b.disabled=false;say(er.message);}};
  c.querySelector('[data-no]').onclick=async e=>{const b=e.target;if(!b.dataset.arm){b.dataset.arm=1;b.textContent='Tap again to refuse';return;}b.disabled=true;const note=c.querySelector('[data-why]').value;
   try{await PQC.commit([{path:'payments/'+x.utr,data:{status:'rejected',decidedAt:new Date(),note},mask:['status','decidedAt','note'],mustExist:true}]);say('Marked as not approved. The student sees: '+note,true);c.querySelectorAll('button,select').forEach(z=>z.disabled=true);}
   catch(er){b.disabled=false;say(er.message);}};}

 async function find(){const q=$('#q').value.trim(),out=$('#found');out.innerHTML='<p class="muted" style="margin:0">Searching…</p>';
  try{let uid=null,pays=[];
   if(/^\d{12}$/.test(q)){const x=await PQC.get('payments/'+q);if(!x){out.innerHTML='<p class="muted" style="margin:0">No request with this UTR.</p>';return;}uid=x.uid;}
   else if(/@/.test(q)){const us=await PQC.query('users',{email:q.toLowerCase()},5);if(!us.length){out.innerHTML='<p class="muted" style="margin:0">No student with this email has saved details.</p>';return;}uid=us[0]._id;}
   else{out.innerHTML='<p class="muted" style="margin:0">Type a 12-digit UTR or an email address.</p>';return;}
   pays=(await PQC.query('payments',{uid},50)).sort((a,b)=>(b.at||0)-(a.at||0));const {p,pr}=await studentInfo(uid);studentCard(out,uid,p,pr,pays);}
  catch(e){out.innerHTML=`<p class="msg bad">${esc(e.message)}</p>`;}}
 function studentCard(out,uid,p,pr,pays){const cur=pr&&typeof pr.exp==='number'?pr.exp:null;
  out.innerHTML=`<div class="card"><b>${esc(p?p.name:'Unknown student')}</b><dl class="kv"><dt>Email</dt><dd>${esc(p?p.email:'')}</dd>${profileKV(p)}<dt>Premium</dt><dd>${cur===null?'None':(cur>=todayN()?'Active until ':'Ended ')+dayDate(cur)}</dd></dl>
   <div><b style="font-size:.95rem">Payments</b>${pays.length?pays.map(x=>`<div class="faint">${when(x.at)} · ₹${esc(x.amount)} · <span class="utr" style="font-size:.9rem">${esc(x.utr)}</span> · <span class="chip ${x.status==='approved'?'good':x.status==='rejected'?'bad':'warn'}">${esc(x.status)}</span>${x.note?' · '+esc(x.note):''}</div>`).join(''):'<div class="faint">None</div>'}</div>
   ${cur!==null?'<div class="row"><button class="btn bad sm" data-rm>Remove Premium (after a refund)</button></div>':''}<p class="msg" data-m></p></div>`;
  const rm=out.querySelector('[data-rm]');if(rm)rm.onclick=async()=>{if(!rm.dataset.arm){rm.dataset.arm=1;rm.textContent='Tap again to remove Premium';return;}
   try{await PQC.del('premium/'+uid);out.querySelector('[data-m]').className='msg good';out.querySelector('[data-m]').textContent='Premium removed.';rm.disabled=true;}catch(e){out.querySelector('[data-m]').className='msg bad';out.querySelector('[data-m]').textContent=e.message;}};}

 PQC.onChange(()=>view());view();
})();
</script>
</body>
</html>
