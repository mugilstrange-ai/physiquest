plugins {
    id 'com.android.application'
}

android {
    namespace 'com.physiquest.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.physiquest.app'
        minSdk 24
        targetSdk 36
        versionCode 23
        versionName '1.19.0'
    }

    // A fixed key for the direct-download APK, so each new version installs over the last one.
    // It is not the Google Play upload key, which never goes into this repository.
    signingConfigs {
        directInstall {
            storeFile file('direct-install.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.directInstall
        }
        // Google Play build: left unsigned here and signed afterwards with the upload key.
        play {
            initWith release
            signingConfig null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // serves the app's page from a private https address instead of file://
    implementation 'androidx.webkit:webkit:1.11.0'
    // Android's own "Sign in with Google" sheet
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
