plugins {
    id 'com.android.application'
}

android {
    namespace 'com.physiquest.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.physiquest.app'
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the standard debug key so the APK installs directly on a phone.
            signingConfig signingConfigs.debug
        }
        // Google Play build: left unsigned here and signed afterwards with the upload key.
        play {
            initWith release
            signingConfig null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
