plugins {
    id 'com.android.application'
}

android {
    namespace 'com.physiquest.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.physiquest.app'
        minSdk 24
        targetSdk 36
        versionCode 8
        versionName '1.7'
    }

    // A fixed key for the direct-download APK, so each new version installs over the last one.
    // It is not the Google Play upload key, which never goes into this repository.
    signingConfigs {
        directInstall {
            storeFile file('direct-install.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.directInstall
        }
        // Google Play build: left unsigned here and signed afterwards with the upload key.
        play {
            initWith release
            signingConfig null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
