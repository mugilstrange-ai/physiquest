<title>PhysiQuest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="NCERT physics from Class 6 to Class 12, class by class and chapter by chapter: an animation for every chapter, key ideas, formulas, quick checks and class mock tests.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=STIX+Two+Text:ital,wght@0,400;1,400;1,600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout concept: a night-time physics lab. Deep violet graph paper from the logo's ground,
   cyan line-art (the logo's stroke) for everything you can touch, and a fixed physics colour
   language so a colour always means the same quantity. One deliberate dark look. */
:root{
  color-scheme: dark;
  --ink:#0f0626;        /* page ground */
  --night:#170a3a;      /* panels */
  --night-2:#1f0e4d;    /* raised panels */
  --plum:#44158f;       /* logo purple */
  --cyan:#19e0dc;       /* logo cyan: interactive + velocity + current */
  --text:#f4efff;
  --muted:#bfb2e4;
  --faint:#8577b8;
  --line:rgba(191,178,228,.16);
  --line-2:rgba(191,178,228,.28);
  --grid:rgba(120,90,210,.10);
  --amber:#ffb547;      /* force, acceleration */
  --magenta:#ff5bd6;    /* magnetic & electric field */
  --lime:#a8f060;       /* potential energy, secondary voltage */
  --coral:#ff8a65;      /* kinetic energy */
  --gold:#ffe06b;       /* electrons */
  --good:#4cf0a0; --warn:#ffd25e; --bad:#ff6b8a;
  --good-bg:rgba(76,240,160,.10); --bad-bg:rgba(255,107,138,.10); --warn-bg:rgba(255,210,94,.10);
  --on-cyan:#0b0420;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-math:"STIX Two Text","Cambria Math","Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:14px; --r-sm:9px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --t-xs:.78rem; --t-sm:.9rem; --t-md:1rem; --t-lg:1.18rem; --t-xl:1.5rem; --t-2xl:2.1rem; --t-3xl:clamp(2rem,5.2vw,3.6rem);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
/* launch screen */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(120% 80% at 50% 28%,#2a0f63 0%,#0f0626 62%);color:var(--text);text-align:center;transition:opacity .4s ease,visibility .4s}
#splash.ready{cursor:pointer}
#splash.out{opacity:0;visibility:hidden;pointer-events:none}
.sp-in{display:flex;flex-direction:column;align-items:center;gap:18px;max-width:30rem;width:100%}
.sp-atom{width:min(46vw,190px);height:auto;overflow:visible;animation:spPop .7s cubic-bezier(.2,.9,.3,1.3) both}
.sp-word{font-family:var(--f-display);font-weight:700;font-size:clamp(1.8rem,7vw,2.6rem);letter-spacing:-.02em;line-height:1.1;animation:spUp .6s .15s both}
.sp-word span{color:var(--cyan)}
.sp-prov{margin:0;animation:spUp .6s .35s both}
.sp-prov figcaption{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.sp-prov blockquote{margin:8px 0 0;font-size:clamp(1.05rem,4.4vw,1.3rem);line-height:1.45;text-wrap:balance}
.sp-bar{width:min(220px,60vw);height:4px;border-radius:4px;background:rgba(191,178,228,.18);overflow:hidden}
.sp-bar i{display:block;height:100%;width:100%;transform-origin:left;background:linear-gradient(90deg,var(--cyan),var(--magenta));animation:spBar 2.6s linear both}
.sp-hint{margin:0;font-size:.85rem;color:var(--faint);min-height:1.3em}
.sp-msg{margin:0;font-size:.9rem;color:var(--muted)}
.sp-msg button{font:inherit;color:var(--ink);background:var(--cyan);border:0;border-radius:8px;padding:6px 12px;margin-left:6px;cursor:pointer}
@keyframes spBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes spPop{from{opacity:0;transform:scale(.6) rotate(-20deg)}to{opacity:1;transform:none}}
@keyframes spUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* JEE and Section B answers */
.jee-card .eyebrow{color:var(--gold)}
.unit-tag{font-family:var(--f-mono);font-size:.9rem;color:var(--muted)}
.int-ask{display:block;margin-top:6px;font-size:.92rem;color:var(--gold)}
.view-error{border-color:rgba(255,107,138,.5);margin-bottom:20px}
.review-item .chip{white-space:normal;max-width:100%;height:auto;text-align:left}
/* accounts */
html:not(.acc-on) #navAcc{display:none}
.acc-card{max-width:560px}
.acc-seg{display:inline-flex;align-self:flex-start;border:1px solid var(--line-2);border-radius:999px;padding:3px;gap:2px;background:rgba(15,6,38,.6);flex-wrap:wrap}
.acc-seg button{font:inherit;font-size:.9rem;border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:999px;cursor:pointer;min-height:40px}
.acc-seg button.on{background:var(--cyan);color:var(--on-cyan);font-weight:700}
.acc-msg{margin:0;font-size:.92rem;min-height:0}
.acc-msg:empty{display:none}
.acc-msg.bad{color:var(--bad)}
.acc-msg.good{color:var(--good,#4cf0a0)}
.ph-row{display:flex;gap:8px;align-items:center}
.ph-cc{font-family:var(--f-mono);color:var(--muted);flex:0 0 auto}
.ph-row input{flex:1;min-width:0}
input[type=email],input[type=password],input[type=tel]{font:inherit;color:var(--text);background:rgba(15,6,38,.7);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:10px 12px;min-height:44px;width:100%}
.acc-age{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.acc-age legend{font-size:.9rem;color:var(--muted);margin-bottom:6px;padding:0}
.acc-age label,.acc-check{display:flex;gap:10px;align-items:center;min-height:40px;cursor:pointer}
.acc-age input,.acc-check input{width:20px;height:20px;accent-color:var(--cyan);flex:0 0 auto}
.acc-danger summary{cursor:pointer;color:var(--muted)}
.btn.danger{background:var(--bad);color:#1a0610;border-color:var(--bad)}
.btn svg{flex:0 0 auto}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),
    radial-gradient(1200px 600px at 85% -10%,rgba(68,21,143,.55),transparent 60%),radial-gradient(900px 500px at -10% 30%,rgba(68,21,143,.35),transparent 60%);
  background-size:32px 32px,32px 32px,auto,auto;background-attachment:fixed;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
a{color:var(--cyan)}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:var(--t-xl)} h3{font-size:var(--t-lg)}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.m{font-family:var(--f-math);font-size:1.08em;white-space:nowrap}
.m i{font-style:italic}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(15,6,38,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:var(--s4);padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);flex:0 0 auto}
.brand svg{display:block}
.brand .b-icon{width:34px;height:34px}
.brand .b-word{width:112px;height:44px;margin-top:-4px}
.xp{margin-left:auto;display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);padding:5px 12px 5px 6px;border:1px solid var(--line-2);border-radius:999px;background:var(--night)}
.xp svg{width:30px;height:30px;display:block}
.xp-txt{display:flex;flex-direction:column;line-height:1.1}
.xp-txt b{font-family:var(--f-mono);font-size:.86rem}
.xp-txt span{font-size:.72rem;color:var(--muted)}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px;margin-top:-2px}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:999px;color:var(--muted);text-decoration:none;font-size:.88rem;border:1px solid transparent;min-height:40px}
.nav a svg{width:18px;height:18px;flex:0 0 auto}
.nav a:hover{color:var(--text);background:rgba(25,224,220,.06)}
.nav a[aria-current="page"]{color:var(--on-cyan);background:var(--cyan);font-weight:700}

/* ---------- generic pieces ---------- */
main{padding-block:var(--s5) var(--s7)}
.view{display:flex;flex-direction:column;gap:var(--s5)}
.v-head{display:flex;flex-direction:column;gap:var(--s2);max-width:70ch}
.v-head h1{font-size:var(--t-2xl)}
.v-head p{color:var(--muted);font-size:var(--t-lg)}
.panel{background:linear-gradient(180deg,var(--night-2),var(--night));border:1px solid var(--line);border-radius:var(--r);padding:var(--s5);min-width:0}
.panel.tight{padding:var(--s4)}
.panel h2{margin-bottom:var(--s3)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:var(--s5);align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4)}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid3{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:var(--s3)}
.row{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.btn{font:inherit;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--cyan);background:var(--cyan);color:var(--on-cyan);cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .2s}
.btn:hover{box-shadow:0 0 0 4px rgba(25,224,220,.18),0 0 24px rgba(25,224,220,.35)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--cyan)}
.btn.quiet{background:transparent;color:var(--text);border-color:var(--line-2);font-weight:400}
.btn.sm{min-height:36px;padding:0 13px;font-size:.88rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--line-2);font-size:.8rem;color:var(--muted);background:rgba(15,6,38,.5);white-space:nowrap}
.chip.c{color:var(--cyan);border-color:rgba(25,224,220,.45)}
.chip.good{color:var(--good);border-color:rgba(76,240,160,.45)}
.chip.warn{color:var(--warn);border-color:rgba(255,210,94,.45)}
.chip.bad{color:var(--bad);border-color:rgba(255,107,138,.45)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;gap:2px;background:rgba(15,6,38,.6);flex-wrap:wrap}
.seg button{font:inherit;font-size:.88rem;border:0;background:transparent;color:var(--muted);padding:7px 13px;border-radius:999px;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--cyan);color:var(--on-cyan);font-weight:700}
.ctl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.ctl label{font-size:.88rem;color:var(--muted)}
.ctl output{font-family:var(--f-mono);font-size:.86rem;color:var(--text)}
.ctl input[type=range]{grid-column:1/-1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--cyan) var(--p,50%),rgba(191,178,228,.22) var(--p,50%))}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:rgba(191,178,228,.22)}
input[type=range]::-moz-range-progress{height:6px;border-radius:6px;background:var(--cyan)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--text);border:4px solid var(--cyan);margin-top:-8px;box-shadow:0 0 12px rgba(25,224,220,.6)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--text);border:4px solid var(--cyan)}
select,input[type=number],input[type=text]{font:inherit;color:var(--text);background:var(--ink);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:9px 11px;min-height:44px}
.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:var(--s2)}
.ro{border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;background:rgba(15,6,38,.55);min-width:0}
.ro > span{display:block;font-size:.76rem;color:var(--muted)}
.ro b{font-family:var(--f-mono);font-weight:600;font-size:1.02rem;font-variant-numeric:tabular-nums}
.canvas-box{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:radial-gradient(800px 400px at 50% 0%,rgba(68,21,143,.45),transparent 70%),#0c0420}
.canvas-box canvas{display:block;width:100%}
.cb-tag{position:absolute;left:12px;top:10px;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;pointer-events:none}
.cb-ctl{position:absolute;right:10px;top:8px;display:flex;gap:6px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);background:rgba(15,6,38,.75);color:var(--text);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:18px;height:18px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.note{border-left:3px solid var(--cyan);padding:10px 14px;background:rgba(25,224,220,.06);border-radius:0 var(--r-sm) var(--r-sm) 0;color:var(--text)}
.note.warn{border-color:var(--warn);background:var(--warn-bg)}
.note.bad{border-color:var(--bad);background:var(--bad-bg)}
.note.good{border-color:var(--good);background:var(--good-bg)}
.placeholder{border:2px dashed var(--line-2);border-radius:var(--r);padding:var(--s5);display:grid;place-items:center;text-align:center;gap:6px;color:var(--muted);min-height:160px;background:repeating-linear-gradient(45deg,rgba(191,178,228,.04) 0 12px,transparent 12px 24px)}
.placeholder b{font-family:var(--f-mono);font-size:.8rem;color:var(--warn);letter-spacing:.06em}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:400}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:rgba(15,6,38,.45)}
.tbl table{min-width:640px}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:var(--s5);align-items:center;position:relative;padding-block:var(--s4)}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}.hero-stage{order:-1;max-width:330px}}
.hero-stage{position:relative;aspect-ratio:5/6;max-width:500px;width:100%;justify-self:center}
.hero-stage canvas{position:absolute;inset:0;width:100%;height:100%}
.hero-stage .logo-big{position:absolute;left:8%;top:5%;width:84%;height:90%;overflow:visible}
.bp .panel{scroll-margin-top:140px}
.hero-copy{display:flex;flex-direction:column;gap:var(--s4);min-width:0}
.hero-copy h1{font-size:var(--t-3xl);font-weight:800;line-height:1.04}
.hero-copy h1 em{font-style:normal;color:var(--cyan)}
.hero-copy p{font-size:var(--t-lg);color:var(--muted);max-width:58ch}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s2)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{border-top:2px solid var(--cyan);padding-top:8px}
.stat b{font-family:var(--f-display);font-size:1.5rem;display:block}
.stat > span{font-size:.82rem;color:var(--muted);display:block;line-height:1.35}
.quest{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--text);padding:var(--s4);border-radius:var(--r);border:1px solid var(--line);background:linear-gradient(180deg,var(--night-2),var(--night));transition:border-color .2s,transform .2s,box-shadow .2s;min-width:0}
.quest:hover{border-color:rgba(25,224,220,.6);transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.35),0 0 0 1px rgba(25,224,220,.2)}
.quest svg.qi{width:46px;height:46px}
.quest h3{font-size:1rem}
.quest p{color:var(--muted);font-size:.92rem}
.quest .row{margin-top:auto}
.lang{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:var(--s3)}
.lang div{display:flex;gap:10px;align-items:center;font-size:.9rem}
.lang svg{width:54px;height:24px;flex:0 0 auto}

/* ---------- learning path ---------- */
.board-box{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);background:#0b0420}
.board{display:block;width:100%;min-width:680px;height:auto}
.board.vert{min-width:0;max-width:460px;margin:0 auto}
.node{cursor:pointer}
.node:focus{outline:none}
.node:focus-visible .chipbody{stroke:var(--text);stroke-width:3}
.trace{fill:none;stroke-linecap:round;stroke-linejoin:round}
.pulse{animation:pulse 1.6s linear infinite}
@keyframes pulse{to{stroke-dashoffset:-60}}
.ring-pulse{animation:ringp 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ringp{0%,100%{opacity:.35}50%{opacity:1}}
.lvl-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:var(--s3)}
.lvl-card{text-align:left;font:inherit;color:var(--text);background:var(--night);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:center}
.lvl-card[aria-pressed="true"]{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
.lvl-card .ln{font-family:var(--f-display);font-size:1.2rem;color:var(--cyan);width:34px;flex:0 0 auto}
.lvl-card small{display:block;color:var(--muted)}
.act-list{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.act-list a{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);color:var(--text);text-decoration:none;background:rgba(15,6,38,.5)}
.act-list a:hover{border-color:rgba(25,224,220,.5)}
.act-list .tick{margin-left:auto}
ul.goals{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}

/* ---------- lesson ---------- */
.steps-derive{display:flex;flex-direction:column;gap:10px;counter-reset:d}
.dstep{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start;padding:12px;border-radius:var(--r-sm);border:1px solid var(--line);background:rgba(15,6,38,.45)}
.dstep::before{counter-increment:d;content:counter(d);font-family:var(--f-display);color:var(--on-cyan);background:var(--cyan);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.85rem}
.dstep .eq{font-family:var(--f-math);font-size:1.3rem;margin:4px 0;overflow-x:auto}
.dstep .eq i{font-style:italic}
.dstep[hidden]{display:none}

/* ---------- questions ---------- */
.q{display:flex;flex-direction:column;gap:var(--s3)}
.q-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.q-prompt{font-size:1.06rem}
.q-visual{border:1px solid var(--line);border-radius:var(--r-sm);background:#0c0420;padding:10px;overflow-x:auto}
.q-visual svg{display:block;margin:0 auto;max-width:100%;height:auto}
.opts{display:grid;gap:8px}
.opts.cols{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:560px){.opts.cols{grid-template-columns:minmax(0,1fr)}}
.opt{font:inherit;text-align:left;color:var(--text);background:rgba(15,6,38,.6);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:11px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;min-height:46px}
.opt:hover:not([disabled]){border-color:var(--cyan)}
.opt .k{font-family:var(--f-mono);font-size:.8rem;color:var(--cyan);border:1px solid rgba(25,224,220,.4);border-radius:6px;padding:0 6px;flex:0 0 auto;margin-top:2px}
.opt.sel{border-color:var(--cyan);background:rgba(25,224,220,.08)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.opt svg{display:block;width:100%;height:auto}
.fb{border-radius:var(--r-sm);padding:12px 14px;border:1px solid var(--line)}
.fb.good{border-color:rgba(76,240,160,.5);background:var(--good-bg)}
.fb.bad{border-color:rgba(255,107,138,.5);background:var(--bad-bg)}
.fb b{display:block;margin-bottom:2px}
.hint{color:var(--warn)}
details.hintbox summary{cursor:pointer;color:var(--warn);font-size:.92rem;min-height:32px;display:inline-flex;align-items:center}
.numrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.numrow input{width:140px}

/* ---------- circuit lab ---------- */
.tools{display:flex;flex-wrap:wrap;gap:6px}
.tool{font:inherit;font-size:.86rem;display:flex;flex-direction:column;align-items:center;gap:2px;width:84px;padding:8px 4px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:rgba(15,6,38,.6);color:var(--muted);cursor:pointer}
.tool svg{width:48px;height:26px}
.tool[aria-pressed="true"]{border-color:var(--cyan);color:var(--text);background:rgba(25,224,220,.1);box-shadow:0 0 0 1px var(--cyan)}
.cboard-box{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);background:#0b0420}
.cboard{display:block;width:100%;min-width:540px;height:auto;touch-action:manipulation}
.edge-hit{fill:none;stroke:transparent;stroke-width:34;cursor:pointer;pointer-events:stroke}
.edge-hit:hover+.edge-hint,.edge-hit:focus+.edge-hint{stroke:rgba(25,224,220,.35)}
.edge-hint{fill:none;stroke:transparent;stroke-width:6;stroke-linecap:round;pointer-events:none}
.edge-hit:focus{outline:none}
.goal{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--line)}
.goal .gi{width:22px;height:22px;flex:0 0 auto;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;font-size:.8rem;margin-top:1px}
.goal.ok{border-color:rgba(76,240,160,.45);background:var(--good-bg)}
.goal.ok .gi{border-color:var(--good);background:var(--good);color:var(--on-cyan)}
.goal.no{border-color:rgba(255,107,138,.45);background:var(--bad-bg)}
.goal.no .gi{border-color:var(--bad);color:var(--bad)}
.goal small{display:block;color:var(--muted);margin-top:2px}

/* ---------- studio ---------- */
.studio-svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.lbl-chip{font:inherit;font-size:.88rem;padding:8px 12px;border-radius:999px;border:1px solid var(--line-2);background:rgba(15,6,38,.6);color:var(--text);cursor:pointer;min-height:40px;display:inline-flex;gap:7px;align-items:center}
.lbl-chip[aria-pressed="true"]{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber);background:rgba(255,181,71,.1)}

/* ---------- mock ---------- */
.mock-dots{display:flex;gap:6px;flex-wrap:wrap}
.mock-dots button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);background:transparent;color:var(--muted);font:inherit;font-size:.82rem;cursor:pointer}
.mock-dots button.ans{background:rgba(25,224,220,.18);color:var(--text);border-color:rgba(25,224,220,.5)}
.mock-dots button.cur{border-color:var(--cyan);box-shadow:0 0 0 2px var(--cyan)}
.mock-dots button.flag{border-color:var(--warn)}
.timer{font-family:var(--f-mono);font-size:1.1rem}
.score-ring{width:170px;height:170px;flex:0 0 auto}
.review-item{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:var(--r-sm);border:1px solid var(--line);background:rgba(15,6,38,.45)}
.bar{height:10px;border-radius:6px;background:rgba(191,178,228,.16);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--cyan);transition:width 1s cubic-bezier(.2,.8,.2,1)}

/* ---------- badges ---------- */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:var(--s3)}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:var(--s4) var(--s3);border-radius:var(--r);border:1px solid var(--line);background:var(--night)}
.badge svg{width:84px;height:94px}
.badge.locked svg{filter:saturate(.35) brightness(.85);opacity:.7}
.view > .seg{align-self:flex-start}
a.chip{text-decoration:none}
a.chip:hover{background:rgba(25,224,220,.1)}
.badge b{font-size:.95rem}
.badge small{color:var(--muted);font-size:.8rem}

/* ---------- toast & fx ---------- */
#toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:var(--night-2);border:1px solid rgba(25,224,220,.55);box-shadow:0 12px 30px rgba(0,0,0,.45),0 0 26px rgba(25,224,220,.25);max-width:min(360px,calc(100vw - 32px));animation:tin .35s cubic-bezier(.2,.9,.3,1.3)}
.toast svg{width:38px;height:42px;flex:0 0 auto}
.toast b{display:block}
.toast span{color:var(--muted);font-size:.88rem}
@keyframes tin{from{transform:translateY(16px) scale(.96);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:79;width:100%;height:100%}
.bp h2{font-size:var(--t-xl)}
.bp h3{font-size:1.02rem;margin-top:var(--s3)}
.bp p,.bp li{color:var(--text);max-width:75ch}
.bp ul,.bp ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.bp-toc{display:flex;flex-wrap:wrap;gap:6px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sw{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--night)}
.sw i{display:block;height:46px}
.sw div{padding:8px 10px;font-size:.82rem}
.sw code{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
@media (max-width:560px){.cboard{min-width:0}}
/* ---------- NCERT classes and chapters ---------- */
h1[tabindex="-1"]:focus{outline:none}
.cls-tabs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:620px){.cls-tabs{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cls-tab{font:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px 9px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:rgba(15,6,38,.6);color:var(--text);text-decoration:none;cursor:pointer;min-height:44px;transition:border-color .2s,transform .2s}
.cls-tab:hover{border-color:rgba(25,224,220,.6);transform:translateY(-2px)}
.cls-tab small{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.14em;color:var(--faint)}
.cls-tab b{font-family:var(--f-display);font-size:1.45rem;line-height:1.1}
.cls-tab em{font-style:normal;font-size:.72rem;color:var(--muted)}
.cls-tab i{display:block;width:78%;height:4px;border-radius:4px;background:rgba(191,178,228,.18);overflow:hidden;margin-top:4px}
.cls-tab i span{display:block;height:100%;border-radius:4px}
.cls-tab[aria-current="page"],.cls-tab[aria-pressed="true"]{border-color:var(--cyan);background:rgba(25,224,220,.12);box-shadow:0 0 0 1px var(--cyan)}
.cls-tab[aria-current="page"] b,.cls-tab[aria-pressed="true"] b{color:var(--cyan)}
.cls-head-in{display:flex;gap:var(--s5);align-items:center}
.cls-ring-box{flex:0 0 132px}
.cls-ring{width:132px;height:132px;display:block}
@media (max-width:620px){.cls-head-in{flex-direction:column;align-items:flex-start}.cls-ring-box{flex-basis:auto}.cls-ring{width:104px;height:104px}}
.ch-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4)}
@media (max-width:900px){.ch-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.ch-grid{grid-template-columns:minmax(0,1fr)}}
.chcard{padding:0;overflow:hidden;gap:0}
.chcard .chthumb{display:block;width:100%;aspect-ratio:8/5;height:auto;background:radial-gradient(400px 200px at 50% 0%,rgba(68,21,143,.5),transparent 70%),#0c0420;border-bottom:1px solid var(--line)}
.chcard .chmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px var(--s4) 0}
.chcard h3{padding:6px var(--s4) 0;font-size:1.05rem;margin:0}
.chcard p{padding:4px var(--s4) var(--s4);color:var(--muted);margin:0;font-size:.92rem}
.note.hook{border-color:var(--amber);background:rgba(255,181,71,.07)}
ol.ideas{margin:0;padding:0;list-style:none;counter-reset:idea;display:flex;flex-direction:column;gap:12px}
ol.ideas li{counter-increment:idea;display:flex;gap:12px;align-items:flex-start}
ol.ideas li::before{content:counter(idea);flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:.8rem;color:var(--on-cyan);background:var(--cyan)}
table.fml{min-width:0;width:100%}
table.fml td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
table.fml tr:last-child td{border-bottom:0}
table.fml td:first-child{white-space:nowrap;font-size:1.08rem;color:var(--text)}
table.fml td:last-child{color:var(--muted)}
.ch-nav{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.ch-nav .btn{flex-direction:column;align-items:flex-start;gap:2px;padding:10px 16px;border-radius:var(--r);height:auto;text-align:left}
.ch-nav .btn.next{align-items:flex-end;text-align:right}
.ch-nav .btn small{font-weight:400;color:var(--muted);font-size:.82rem}
@media (max-width:560px){.ch-nav{grid-template-columns:minmax(0,1fr)}.ch-nav .btn.next{align-items:flex-start;text-align:left}}
textarea.code{width:100%;font-family:var(--f-mono);font-size:.82rem;color:var(--text);background:rgba(15,6,38,.7);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:10px;resize:vertical;word-break:break-all}
/* ---------- lessons, practice, NEET, plans ---------- */
.notes h3{font-size:1.05rem;margin:18px 0 6px;color:var(--cyan)}
.notes h3:first-of-type{margin-top:6px}
.notes p{margin:0;max-width:75ch}
.fb.warn{border-color:var(--warn);background:var(--warn-bg)}
.chip{max-width:100%}
.q-top .chip,.row .chip{white-space:normal}
.panel.gq{background:rgba(15,6,38,.55)}
.neet-card h3{margin:0}
.neet-card p{color:var(--muted);margin:0;font-size:.9rem}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4)}
@media (max-width:860px){.plans{grid-template-columns:minmax(0,1fr)}}
.plan{display:flex;flex-direction:column;gap:12px;padding:var(--s5);border-radius:var(--r);border:1px solid var(--line);background:linear-gradient(180deg,var(--night-2),var(--night))}
.plan.best{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 12px 40px rgba(25,224,220,.12)}
.plan .price{font-family:var(--f-display);font-size:2.2rem;line-height:1.1}
.plan .price small{font-family:var(--f-body);font-size:1rem;color:var(--muted)}
.plan ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;flex:1}
.plan .btn,.plan .chip{align-self:flex-start}
.field{display:flex;flex-direction:column;gap:6px}
.qr{flex:0 0 auto;background:#fff;border-radius:10px;padding:6px;line-height:0}
.qr svg{display:block;width:168px;height:168px}
.neet-card.locked{opacity:.55;cursor:default}
.neet-card.locked:hover{transform:none;border-color:var(--line);box-shadow:none}
.lock-panel{border-color:rgba(255,224,107,.45)}
.chip.bad{color:var(--bad);border-color:rgba(255,107,138,.5)}
.note.lock{border-color:var(--gold);background:rgba(255,224,107,.07)}
.pay-steps .eyebrow{color:var(--gold)}
.field label{font-size:.9rem;color:var(--muted)}
select,input[type=text]{font:inherit;color:var(--text);background:rgba(15,6,38,.7);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:10px 12px;min-height:44px;width:100%}
footer{border-top:1px solid var(--line);padding-block:var(--s5);color:var(--faint);font-size:.85rem}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
</head>
